name: Construir APK Spark Go

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Armar estructura Android para 8227L
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/carlos/sparkgolauncher
          cp index.html app/src/main/assets/
          if [ -f spark_rojo.png ]; then cp spark_rojo.png app/src/main/assets/; fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SparkGoLauncher"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' version '8.2.0' }
          android {
              namespace 'com.carlos.sparkgolauncher'
              compileSdk 33
              defaultConfig {
                  applicationId "com.carlos.sparkgolauncher"
                  minSdk 21
                  targetSdk 27
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.carlos.sparkgolauncher">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:label="Spark Go Launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/carlos/sparkgolauncher/MainActivity.java
          package com.carlos.sparkgolauncher;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {
              private WebView webView;
              private Location ultimaUbicacion = null;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_RESULT_CODE = 202;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("video/*");
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(Intent.createChooser(intent, "Seleccionar Videos USB"), FILE_CHOOSER_RESULT_CODE);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new RadioBridge(this), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
                  verificarPermisos();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE && filePathCallback != null) {
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              ClipData clipData = data.getClipData();
                              results = new Uri[clipData.getItemCount()];
                              for (int i = 0; i < clipData.getItemCount(); i++) {
                                  results[i] = clipData.getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {}

              private void verificarPermisos() {
                  if (Build.VERSION.SDK_INT >= 23) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED ||
                          checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION,
                              Manifest.permission.READ_EXTERNAL_STORAGE
                          }, 101);
                      } else {
                          iniciarVelocimetroGPS();
                      }
                  } else {
                      iniciarVelocimetroGPS();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  if (requestCode == 101) {
                      iniciarVelocimetroGPS();
                  }
              }

              private void iniciarVelocimetroGPS() {
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500, 1, new LocationListener() {
                          @Override
                          public void onLocationChanged(final Location loc) {
                              ultimaUbicacion = loc;
                              final float kmh = loc.hasSpeed() ? loc.getSpeed() * 3.6f : 0f;
                              final double lat = loc.getLatitude();
                              final double lon = loc.getLongitude();
                              webView.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      webView.loadUrl("javascript:if(window.actualizarVelocidadGPS) actualizarVelocidadGPS(" + kmh + "," + lat + "," + lon + ");");
                                  }
                              });
                          }
                          @Override public void onStatusChanged(String p, int s, Bundle e) {}
                          @Override public void onProviderEnabled(String p) {}
                          @Override public void onProviderDisabled(String p) {}
                      });
                  } catch (SecurityException ignored) {}
              }

              public class RadioBridge {
                  Context ctx;
                  RadioBridge(Context c) { this.ctx = c; }

                  @JavascriptInterface
                  public void forceGpsCenter() {
                      if (ultimaUbicacion != null) {
                          final double lat = ultimaUbicacion.getLatitude();
                          final double lon = ultimaUbicacion.getLongitude();
                          webView.post(new Runnable() {
                              @Override
                              public void run() {
                                  webView.loadUrl("javascript:actualizarMapaCoordenadas(" + lat + "," + lon + ");");
                              }
                          });
                      }
                  }

                  @JavascriptInterface
                  public void openSystemSettings() {
                      try {
                          Intent intent = new Intent(Settings.ACTION_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void openFileManager() {
                      PackageManager pm = ctx.getPackageManager();
                      Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                      mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                      List<ResolveInfo> apps = pm.queryIntentActivities(mainIntent, 0);
                      String[] claves = {"file", "archivos", "explorer", "explorador", "gestor", "documentsui", "esfile"};
                      for (ResolveInfo app : apps) {
                          String label = app.loadLabel(pm).toString().toLowerCase();
                          String pkg = app.activityInfo.packageName.toLowerCase();
                          for (String c : claves) {
                              if (label.contains(c) || pkg.contains(c)) {
                                  launchPackage(app.activityInfo.packageName);
                                  return;
                              }
                          }
                      }
                      try {
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.setType("*/*");
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(Intent.createChooser(intent, "Gestor de Archivos"));
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public String getInstalledApps() {
                      JSONArray arr = new JSONArray();
                      try {
                          final PackageManager pm = ctx.getPackageManager();
                          Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                          mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> apps = pm.queryIntentActivities(mainIntent, 0);
                          Collections.sort(apps, new Comparator<ResolveInfo>() {
                              @Override
                              public int compare(ResolveInfo a, ResolveInfo b) {
                                  return a.loadLabel(pm).toString().compareToIgnoreCase(b.loadLabel(pm).toString());
                              }
                          });
                          for (ResolveInfo app : apps) {
                              String pkg = app.activityInfo.packageName;
                              if (!pkg.equals(ctx.getPackageName())) {
                                  JSONObject obj = new JSONObject();
                                  obj.put("label", app.loadLabel(pm).toString().trim());
                                  obj.put("pkg", pkg);
                                  arr.put(obj);
                              }
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public void launchPackage(String pkgName) {
                      try {
                          PackageManager pm = ctx.getPackageManager();
                          Intent launch = pm.getLaunchIntentForPackage(pkgName);
                          if (launch != null) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                              ctx.startActivity(launch);
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void launchByLabel(String nombreBuscado) {
                      PackageManager pm = ctx.getPackageManager();
                      Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                      mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                      List<ResolveInfo> apps = pm.queryIntentActivities(mainIntent, 0);

                      for (ResolveInfo app : apps) {
                          String label = app.loadLabel(pm).toString().trim();
                          String pkg = app.activityInfo.packageName.toLowerCase();
                          if (label.equalsIgnoreCase(nombreBuscado) ||
                              label.toLowerCase().contains(nombreBuscado.toLowerCase()) ||
                             (nombreBuscado.equals("AndroidAuto") && (label.equalsIgnoreCase("CPLink") || pkg.contains("cplink") || pkg.contains("zlink") || pkg.contains("headunit"))) ||
                             (nombreBuscado.equals("Maps") && (pkg.contains("apps.maps") || label.toLowerCase().contains("maps")))) {
                              launchPackage(app.activityInfo.packageName);
                              return;
                          }
                      }
                  }

                  @JavascriptInterface
                  public void mediaControl(String cmd) {
                      AudioManager am = (AudioManager) ctx.getSystemService(Context.AUDIO_SERVICE);
                      int keyCode = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
                      if ("next".equals(cmd)) keyCode = KeyEvent.KEYCODE_MEDIA_NEXT;
                      if ("prev".equals(cmd)) keyCode = KeyEvent.KEYCODE_MEDIA_PREVIOUS;
                      long eventTime = SystemClock.uptimeMillis();
                      am.dispatchMediaKeyEvent(new KeyEvent(eventTime, eventTime, KeyEvent.ACTION_DOWN, keyCode, 0));
                      am.dispatchMediaKeyEvent(new KeyEvent(eventTime, eventTime, KeyEvent.ACTION_UP, keyCode, 0));
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SparkGoLauncher.apk

      - name: Entregar APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SparkGoLauncher-Instalador
          path: SparkGoLauncher.apk
